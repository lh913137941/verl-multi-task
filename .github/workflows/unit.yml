name: unit

on:
  push:
    branches:
      - chatgpt/092203-simplified-fusion
      - chatgpt/0928-merge-verl-expansion
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unit-test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit suite
        run: python -m pytest -q tests/unit
